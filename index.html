<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recepton</title>
<style>
:root{--bg:#0f1117;--fg:#f2f4f8;--ac:#7c5cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#1c1f2e,var(--bg));color:var(--fg);font-family:system-ui,sans-serif;text-align:center;padding:16px}
h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 .5rem;background:linear-gradient(90deg,var(--ac),#4fd1c5);-webkit-background-clip:text;background-clip:text;color:transparent}
p{opacity:.75;font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>Recepton</h1>
<p>Vercel üzerinde yayında. Merhaba dünya!</p>
</main>
</body>
</html>
